name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: Filesystem vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          # Checkov is the dedicated Terraform policy gate below. Trivy remains
          # responsible for dependency vulnerabilities and committed secrets.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  terraform:
    name: Terraform policy checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          # These checks are intentional, documented exceptions: KMS key-policy
          # syntax requires Resource "*"; the Glue job has an explicit security
          # configuration; only the raw bucket emits ingestion events; CloudFront
          # needs an ACL-enabled log bucket; S3 server-log destinations require
          # SSE-S3; and DR relies on S3 versioning plus Terraform recovery until
          # a second-region replica is introduced.
          skip_check: CKV_AWS_109,CKV_AWS_111,CKV_AWS_356,CKV_AWS_195,CKV2_AWS_62,CKV2_AWS_65,CKV2_AWS_42,CKV2_AWS_47,CKV_AWS_144,CKV_AWS_145
          quiet: true
