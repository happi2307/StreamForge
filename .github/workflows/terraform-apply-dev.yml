name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to confirm the dev deployment.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    if: inputs.confirm == 'deploy'
    environment: dev
    runs-on: ubuntu-24.04
    env:
      TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
      TF_VAR_cost_center: ${{ vars.TF_VAR_COST_CENTER }}
      TF_VAR_kms_alias_name: ${{ vars.TF_VAR_KMS_ALIAS_NAME }}
      TF_VAR_kms_description: ${{ vars.TF_VAR_KMS_DESCRIPTION }}
      TF_VAR_bucket_name_overrides: ${{ vars.TF_VAR_BUCKET_NAME_OVERRIDES }}
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/package_lambdas.py --environment dev --include-dashboard --include-loader
        working-directory: .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=${{ vars.TF_STATE_KEY }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" -backend-config="encrypt=true"
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - run: terraform apply -input=false tfplan
