name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-prod to confirm the production deployment.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    if: inputs.confirm == 'deploy-prod'
    environment: prod
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/package_lambdas.py --environment prod
        working-directory: .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=${{ vars.TF_STATE_KEY }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" -backend-config="encrypt=true"
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
