name: Terraform plan

on:
  pull_request:
    paths:
      - terraform/**
      - lambda/**
      - web/**
      - dashboard_api.py
      - scripts/package_lambdas.py
      - .github/workflows/terraform-plan.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan-dev:
    name: Dev plan
    environment: dev
    runs-on: ubuntu-24.04
    env:
      TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
      TF_VAR_cost_center: ${{ vars.TF_VAR_COST_CENTER }}
      TF_VAR_kms_alias_name: ${{ vars.TF_VAR_KMS_ALIAS_NAME }}
      TF_VAR_kms_description: ${{ vars.TF_VAR_KMS_DESCRIPTION }}
      TF_VAR_bucket_name_overrides: ${{ vars.TF_VAR_BUCKET_NAME_OVERRIDES }}
      TF_VAR_operations_alert_email: ${{ vars.TF_VAR_OPERATIONS_ALERT_EMAIL }}
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/package_lambdas.py --environment dev --include-dashboard --include-loader
        working-directory: .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=${{ vars.TF_STATE_KEY }}" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" -backend-config="encrypt=true"
      - run: terraform plan -input=false -lock-timeout=5m -no-color
